name: CI - Testes automatizados



on:

  push:
  
    branches:
    
      - main
      
      - 'review/**'
      
  pull_request:
  
    branches:
    
      - main
      


jobs:

  testes:
  
    name: Testes e cobertura
    
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Baixar o código
      
        uses: actions/checkout@v4
        
      - name: Configurar Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: '3.12'
          
      - name: Instalar ferramenta de cobertura
      
        run: python -m pip install coverage
        
      - name: Executar testes automatizados
      
        run: python -m coverage run --branch -m unittest -v
        
      - name: Verificar compilação dos módulos
      
        run: python -m py_compile database.py estoque.py main.py test_estoque.py
        
      - name: Publicar relatório de cobertura no log
      
        run: python -m coverage report -m























